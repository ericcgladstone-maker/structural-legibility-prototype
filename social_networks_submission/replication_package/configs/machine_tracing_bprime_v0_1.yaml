experiment_id: machine_tracing_bprime_v0_1
description: "B-prime primary run for the receiver-task evaluation. 8 regimes \xD7\
  \ 4 trace levels \xD7 2 validity coefficients \xD7 CS-M \xD7 3 replicates \xD7 20\
  \ worlds \xD7 1 receiver family + 20% 2nd-family robustness. ~4,200 primary + ~840\
  \ robustness trials; ~50 hrs wall-clock; $0 on local Ollama."
