models:
  source_generator:
    provider: ollama_local
    model_name: llama3.1:8b
    temperature: 0.4
    top_p: 1.0
    max_output_tokens: 512
    seed_supported: false
    reproducibility_policy: distributional_reproduction_only
  mutator:
    provider: ollama_local
    model_name: llama3.1:8b
    temperature: 0.7
    top_p: 1.0
    max_output_tokens: 512
    seed_supported: false
    reproducibility_policy: distributional_reproduction_only
  receiver:
    provider: ollama_local
    model_name: qwen2.5:7b
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 2048
    seed_supported: false
    reproducibility_policy: distributional_reproduction_only
  embedding:
    provider: local_sentence_transformers
    model_name: all-MiniLM-L6-v2
    batch_size: 32
logging:
  store_full_prompts: true
  store_raw_outputs: true
  store_logprobs_if_available: true
  top_logprobs: 5
  store_costs: true
  store_token_counts: true
failure_policy:
  fail_on_empty_output: true
  mark_invalid_on_parse_error: true
  max_retries_per_call: 2
  retry_backoff_seconds: 1.0
run_ordering:
  policy: interleaved_across_cells
  random_seed: 20260601
outputs:
  lineage_path: outputs/machine_tracing_bprime_v0_1.lineage.jsonl
  trace_packets_path: outputs/machine_tracing_bprime_v0_1.trace_packets.jsonl
  receiver_predictions_path: outputs/machine_tracing_bprime_v0_1.receiver.jsonl
  ground_truth_path: outputs/machine_tracing_bprime_v0_1.ground_truth.jsonl
  audit_path: outputs/machine_tracing_bprime_v0_1.audit.md
  report_path: outputs/machine_tracing_bprime_v0_1.report.md
  audit_mode: both
  audit_sample_size: 20
